<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC382D"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
  </defs>
  <rect width="900" height="200" rx="12" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g stroke="white" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
    <line x1="800" y1="0" x2="800" y2="200"/>
  </g>
  <!-- Database with Kubernetes wheel icon -->
  <g transform="translate(120, 100)">
    <!-- Database cylinder -->
    <ellipse cx="-20" cy="-25" rx="22" ry="8" fill="none" stroke="white" stroke-width="2" opacity="0.9"/>
    <line x1="-42" y1="-25" x2="-42" y2="10" stroke="white" stroke-width="2" opacity="0.9"/>
    <line x1="2" y1="-25" x2="2" y2="10" stroke="white" stroke-width="2" opacity="0.9"/>
    <ellipse cx="-20" cy="10" rx="22" ry="8" fill="none" stroke="white" stroke-width="2" opacity="0.9"/>
    <ellipse cx="-20" cy="-8" rx="22" ry="8" fill="none" stroke="white" stroke-width="1.2" opacity="0.3"/>
    <!-- Kubernetes wheel (simplified) -->
    <circle cx="22" cy="5" r="14" fill="none" stroke="white" stroke-width="2" opacity="0.9"/>
    <circle cx="22" cy="5" r="5" fill="none" stroke="white" stroke-width="1.5" opacity="0.7"/>
    <!-- Spokes -->
    <line x1="22" y1="-9" x2="22" y2="-3" stroke="white" stroke-width="1.5" opacity="0.7"/>
    <line x1="22" y1="13" x2="22" y2="19" stroke="white" stroke-width="1.5" opacity="0.7"/>
    <line x1="10" y1="-2" x2="15" y2="1" stroke="white" stroke-width="1.5" opacity="0.7"/>
    <line x1="29" y1="9" x2="34" y2="12" stroke="white" stroke-width="1.5" opacity="0.7"/>
    <line x1="10" y1="12" x2="15" y2="9" stroke="white" stroke-width="1.5" opacity="0.7"/>
    <line x1="29" y1="1" x2="34" y2="-2" stroke="white" stroke-width="1.5" opacity="0.7"/>
  </g>
  <!-- Title -->
  <text x="480" y="90" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle">Redis Operator</text>
  <!-- Subtitle -->
  <text x="480" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="white" opacity="0.8" text-anchor="middle">Lightweight Kubernetes Operator for Redis instances</text>
</svg>
