name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - name: Upload coverage
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v7
        with:
          files: cover.out
          fail_ci_if_error: false
